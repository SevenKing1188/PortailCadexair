<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup - Portail Cadexair</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0F2537 0%, #1a3a52 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .setup-container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
    }

    .setup-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .setup-header h1 {
      font-size: 28px;
      color: #0F2537;
      margin-bottom: 8px;
    }

    .setup-header p {
      color: #999;
      font-size: 14px;
    }

    .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #EE1C25 0%, #E65100 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 24px;
    }

    .alert {
      background: #e5ffe5;
      border: 1px solid #51cf66;
      color: #2b8a2b;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
      line-height: 1.5;
    }

    .alert.info {
      background: #e5f3ff;
      border-color: #339af0;
      color: #1864ab;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #0F2537;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #EE1C25;
      box-shadow: 0 0 0 3px rgba(238,28,37,0.1);
    }

    .form-group small {
      display: block;
      margin-top: 4px;
      color: #999;
      font-size: 12px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #EE1C25 0%, #d41b20 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(238,28,37,0.3);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .error-message {
      background: #ffe5e5;
      color: #EE1C25;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .success-message {
      background: #e5ffe5;
      color: #51cf66;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .loading {
      display: none;
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-top: 10px;
    }

    .footer-link {
      text-align: center;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #f0f0f0;
    }

    .footer-link a {
      color: #EE1C25;
      text-decoration: none;
      font-size: 14px;
    }

    .footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="setup-container">
    <div class="setup-header">
      <div class="logo">⚙️</div>
      <h1>INITIALISATION</h1>
      <p>Créer le compte Master</p>
    </div>

    <div class="alert info">
      ℹ️ Cette page ne s'affiche qu'une seule fois. Après création du master, elle sera désactivée.
    </div>

    <form onsubmit="createMaster(event)">
      <div class="error-message" id="error-msg"></div>
      <div class="success-message" id="success-msg"></div>

      <div class="form-group">
        <label for="email">Email du Master</label>
        <input 
          type="email" 
          id="email" 
          placeholder="master@cadexair.com"
          value="master@cadexair.com"
          required
        >
        <small>Utilisé pour la connexion admin</small>
      </div>

      <div class="form-group">
        <label for="nom">Nom complet</label>
        <input 
          type="text" 
          id="nom" 
          placeholder="Votre nom"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Minimum 12 caractères"
          minlength="12"
          required
        >
        <small>Min 12 caractères, majuscules, minuscules, chiffres, caractères spéciaux</small>
      </div>

      <div class="form-group">
        <label for="password-confirm">Confirmer mot de passe</label>
        <input 
          type="password" 
          id="password-confirm" 
          placeholder="Répète ton mot de passe"
          required
        >
      </div>

      <div class="btn-group">
        <button type="submit" class="btn btn-primary" id="create-btn">
          ✅ Créer le Master
        </button>
      </div>

      <div class="loading" id="loading">
        ⏳ Création en cours...
      </div>
    </form>

    <div class="footer-link">
      <a href="/login">← Retour au Login</a>
    </div>
  </div>

  <script>
    const API_URL = 'https://portail-cadexair.onrender.com/api';

    async function createMaster(event) {
      event.preventDefault();

      const email = document.getElementById('email').value;
      const nom = document.getElementById('nom').value;
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('password-confirm').value;
      const errorMsg = document.getElementById('error-msg');
      const successMsg = document.getElementById('success-msg');
      const createBtn = document.getElementById('create-btn');
      const loading = document.getElementById('loading');

      // Reset messages
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';

      // Vérifier les mots de passe
      if (password !== passwordConfirm) {
        errorMsg.textContent = '❌ Les mots de passe ne correspondent pas';
        errorMsg.style.display = 'block';
        return;
      }

      if (password.length < 12) {
        errorMsg.textContent = '❌ Le mot de passe doit avoir au minimum 12 caractères';
        errorMsg.style.display = 'block';
        return;
      }

      loading.style.display = 'block';
      createBtn.disabled = true;

      try {
        const response = await fetch(`${API_URL}/admin/create-master`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, nom, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Erreur lors de la création');
        }

        successMsg.textContent = '✅ Master créé avec succès! Redirection vers login...';
        successMsg.style.display = 'block';

        setTimeout(() => {
          window.location.href = '/login';
        }, 2000);

      } catch (error) {
        errorMsg.textContent = '❌ ' + error.message;
        errorMsg.style.display = 'block';
      } finally {
        loading.style.display = 'none';
        createBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
