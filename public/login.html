<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadexair - Portail</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      color: #1a1a2e;
      font-size: 28px;
      font-weight: 700;
    }

    .logo p {
      color: #666;
      font-size: 14px;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #16c784;
      box-shadow: 0 0 0 3px rgba(22, 199, 132, 0.1);
    }

    button {
      width: 100%;
      padding: 12px;
      background: #16c784;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    button:hover {
      background: #0fa968;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .alert.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .alert.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: 10px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #16c784;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <h1>Cadexair</h1>
        <p>Portail Administratif</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            placeholder="admin@cadexair.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input 
            type="password" 
            id="password" 
            placeholder="••••••••"
            required
          >
        </div>

        <button type="submit" id="loginBtn">Connexion</button>
      </form>

      <div class="loading" id="loading">
        <span class="spinner"></span>Connexion en cours...
      </div>

      <div class="footer">
        <p>© 2024 Cadexair - Nettoyage de hottes</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://mnhwgndkxrgmidomdlyy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uaHdnbmRreHJnbWlkb21kbHl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NTE0ODcsImV4cCI6MjEwMjAyNzQ4N30.RQcFGRK_N7nYUfrw-pW-CXkG1vTTEaAy6fEoSPNvcqc";
    const API_URL = window.location.origin;

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Vérifier session existante
    async function checkSession() {
      const { data } = await supabase.auth.getSession();
      if (data.session) {
        // Récupère le rôle
        const { data: profile } = await supabase
          .from("profiles")
          .select("role")
          .eq("id", data.session.user.id)
          .single();

        if (profile?.role === "admin") {
          window.location = "/admin.html";
        } else if (profile?.role === "chef") {
          window.location = "/chef.html";
        }
      }
    }

    checkSession();

    // Login
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const alertDiv = document.getElementById("alert");
      const loginBtn = document.getElementById("loginBtn");
      const loading = document.getElementById("loading");

      alertDiv.innerHTML = "";
      alertDiv.classList.remove("error", "success");
      loginBtn.disabled = true;
      loading.style.display = "block";

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password,
        });

        if (error) throw error;

        // Récupère le rôle
        const { data: profile, error: profileError } = await supabase
          .from("profiles")
          .select("role")
          .eq("id", data.user.id)
          .single();

        if (profileError) throw profileError;

        // Redirige selon le rôle
        if (profile.role === "admin") {
          window.location = "/admin.html";
        } else if (profile.role === "chef") {
          window.location = "/chef.html";
        } else {
          throw new Error("Rôle inconnu");
        }
      } catch (err) {
        alertDiv.classList.add("error");
        alertDiv.innerHTML = `<strong>Erreur:</strong> ${err.message}`;
        loginBtn.disabled = false;
        loading.style.display = "none";
      }
    });
  </script>
</body>
</html>
