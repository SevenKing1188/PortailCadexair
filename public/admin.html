<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Cadexair</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #333;
    }

    .header {
      background: #1a1a2e;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
    }

    .header button {
      background: #dc3545;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .header button:hover {
      background: #c82333;
    }

    .container {
      max-width: 1400px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 40px;
    }

    @media (max-width: 1024px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      color: #1a1a2e;
      margin-bottom: 20px;
      font-size: 20px;
      border-bottom: 2px solid #16c784;
      padding-bottom: 15px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #555;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #16c784;
      box-shadow: 0 0 0 3px rgba(22, 199, 132, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #16c784;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #0fa968;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      border-left: 4px solid;
    }

    .alert.error {
      background: #f8d7da;
      color: #721c24;
      border-left-color: #dc3545;
      display: block;
    }

    .alert.success {
      background: #d4edda;
      color: #155724;
      border-left-color: #16c784;
      display: block;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead {
      background: #f8f9fa;
      border-bottom: 2px solid #dee2e6;
    }

    th {
      padding: 15px;
      text-align: left;
      font-weight: 600;
      color: #555;
    }

    td {
      padding: 12px 15px;
      border-bottom: 1px solid #dee2e6;
    }

    tr:hover {
      background: #f8f9fa;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge.admin {
      background: #cfe2ff;
      color: #084298;
    }

    .badge.chef {
      background: #d1e7dd;
      color: #0f5132;
    }

    .badge.pending {
      background: #fff3cd;
      color: #664d03;
    }

    .badge.in_progress {
      background: #cfe2ff;
      color: #084298;
    }

    .badge.completed {
      background: #d1e7dd;
      color: #0f5132;
    }

    .loading {
      display: none;
      text-align: center;
      color: #666;
      font-size: 14px;
      padding: 20px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #16c784;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .full-width {
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔧 Admin Cadexair</h1>
    <button onclick="logout()">Déconnexion</button>
  </div>

  <div class="container">
    <!-- Créer Utilisateur -->
    <div class="grid">
      <div class="card">
        <h2>➕ Créer Utilisateur</h2>
        <div id="createUserAlert" class="alert"></div>

        <div class="form-group">
          <label for="userEmail">Email</label>
          <input 
            type="email" 
            id="userEmail" 
            placeholder="user@cadexair.com"
          >
        </div>

        <div class="form-group">
          <label for="userPassword">Mot de passe</label>
          <input 
            type="password" 
            id="userPassword" 
            placeholder="Minimum 6 caractères"
          >
        </div>

        <div class="form-group">
          <label for="userName">Nom complet</label>
          <input 
            type="text" 
            id="userName" 
            placeholder="Jean Dupont"
          >
        </div>

        <div class="form-group">
          <label for="userRole">Rôle</label>
          <select id="userRole">
            <option value="chef">Chef d'équipe</option>
            <option value="admin">Administrateur</option>
          </select>
        </div>

        <button onclick="createUser()" id="createUserBtn">Créer Utilisateur</button>
      </div>

      <!-- Assigner Bon -->
      <div class="card">
        <h2>📋 Assigner Bon de Travail</h2>
        <div id="assignOrderAlert" class="alert"></div>

        <div class="form-group">
          <label for="orderTitle">Titre du bon</label>
          <input 
            type="text" 
            id="orderTitle" 
            placeholder="Nettoyage hotte - Restaurant XYZ"
          >
        </div>

        <div class="form-group">
          <label for="orderDesc">Description</label>
          <textarea 
            id="orderDesc" 
            placeholder="Détails du travail à effectuer..."
          ></textarea>
        </div>

        <div class="form-group">
          <label for="chefSelect">Chef d'équipe responsable</label>
          <select id="chefSelect">
            <option value="">Chargement...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="orderDate">Date assignée</label>
          <input type="date" id="orderDate">
        </div>

        <button onclick="assignWorkOrder()" id="assignBtn">Assigner Bon</button>
      </div>
    </div>

    <!-- Liste des utilisateurs -->
    <div class="card">
      <h2>👥 Utilisateurs</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Nom</th>
              <th>Email</th>
              <th>Rôle</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr>
              <td colspan="3" style="text-align: center;">
                <span class="spinner"></span> Chargement...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Liste des bons -->
    <div class="card">
      <h2>📦 Bons de Travail</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Titre</th>
              <th>Chef d'équipe</th>
              <th>Date</th>
              <th>Statut</th>
            </tr>
          </thead>
          <tbody id="workOrdersTableBody">
            <tr>
              <td colspan="4" style="text-align: center;">
                <span class="spinner"></span> Chargement...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://mnhwgndkxrgmidomdlyy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uaHdnbmRreHJnbWlkb21kbHl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NTE0ODcsImV4cCI6MjEwMjAyNzQ4N30.RQcFGRK_N7nYUfrw-pW-CXkG1vTTEaAy6fEoSPNvcqc";
    const API_URL = window.location.origin;

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;
    let chefs = [];

    // Initialisation
    async function init() {
      const { data } = await supabaseClient.auth.getSession();
      if (!data.session) {
        window.location = "/login.html";
        return;
      }

      currentUser = data.session.user;

      // Vérifie que c'est un admin
      const { data: profile } = await supabase
        .from("profiles")
        .select("role")
        .eq("id", currentUser.id)
        .single();

      if (profile?.role !== "admin") {
        window.location = "/login.html";
        return;
      }

      loadChefs();
      loadUsers();
      loadWorkOrders();

      // Auto-refresh toutes les 30s
      setInterval(() => {
        loadUsers();
        loadWorkOrders();
      }, 30000);
    }

    // Charge les chefs
    async function loadChefs() {
      const { data } = await supabase
        .from("profiles")
        .select("id, name")
        .eq("role", "chef")
        .order("name");

      chefs = data || [];
      const select = document.getElementById("chefSelect");
      select.innerHTML = chefs
        .map(c => `<option value="${c.id}">${c.name}</option>`)
        .join("");
    }

    // Charge les utilisateurs
    async function loadUsers() {
      const { data: session } = await supabaseClient.auth.getSession();
      const token = session?.session?.access_token;

      try {
        const response = await fetch(`${API_URL}/api/admin/users`, {
          headers: { "Authorization": `Bearer ${token}` },
        });

        const users = await response.json();
        const tbody = document.getElementById("usersTableBody");

        if (users.length === 0) {
          tbody.innerHTML = "<tr><td colspan='3'>Aucun utilisateur</td></tr>";
          return;
        }

        tbody.innerHTML = users
          .map(user => `
            <tr>
              <td>${user.name}</td>
              <td>${user.id.substring(0, 20)}...</td>
              <td><span class="badge ${user.role}">${user.role === 'admin' ? '🔐 Admin' : '👨 Chef'}</span></td>
            </tr>
          `)
          .join("");
      } catch (err) {
        document.getElementById("usersTableBody").innerHTML =
          `<tr><td colspan="3">Erreur: ${err.message}</td></tr>`;
      }
    }

    // Crée un utilisateur
    async function createUser() {
      const email = document.getElementById("userEmail").value;
      const password = document.getElementById("userPassword").value;
      const name = document.getElementById("userName").value;
      const role = document.getElementById("userRole").value;
      const alertDiv = document.getElementById("createUserAlert");
      const btn = document.getElementById("createUserBtn");

      if (!email || !password || !name) {
        alertDiv.classList.add("error");
        alertDiv.innerHTML = "Tous les champs sont requis";
        return;
      }

      if (password.length < 6) {
        alertDiv.classList.add("error");
        alertDiv.innerHTML = "Le mot de passe doit faire au minimum 6 caractères";
        return;
      }

      btn.disabled = true;
      alertDiv.classList.remove("error", "success");
      alertDiv.innerHTML = "";

      try {
        const { data: session } = await supabaseClient.auth.getSession();
        const token = session?.session?.access_token;

        const response = await fetch(`${API_URL}/api/admin/create-user`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`,
          },
          body: JSON.stringify({ email, password, name, role }),
        });

        const result = await response.json();

        if (!response.ok) throw new Error(result.error);

        alertDiv.classList.add("success");
        alertDiv.innerHTML = `✅ ${name} créé avec succès!`;

        document.getElementById("userEmail").value = "";
        document.getElementById("userPassword").value = "";
        document.getElementById("userName").value = "";

        loadChefs();
        loadUsers();

        setTimeout(() => alertDiv.innerHTML = "", 3000);
      } catch (err) {
        alertDiv.classList.add("error");
        alertDiv.innerHTML = `❌ ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    // Charge les bons
    async function loadWorkOrders() {
      const { data: session } = await supabaseClient.auth.getSession();
      const token = session?.session?.access_token;

      try {
        const response = await fetch(`${API_URL}/api/admin/workorders`, {
          headers: { "Authorization": `Bearer ${token}` },
        });

        const orders = await response.json();
        const tbody = document.getElementById("workOrdersTableBody");

        if (orders.length === 0) {
          tbody.innerHTML = "<tr><td colspan='4'>Aucun bon assigné</td></tr>";
          return;
        }

        tbody.innerHTML = orders
          .map(order => `
            <tr>
              <td>${order.title}</td>
              <td>${order.profiles?.name || "N/A"}</td>
              <td>${new Date(order.assigned_date).toLocaleDateString('fr-FR')}</td>
              <td><span class="badge ${order.status}">${statusLabel(order.status)}</span></td>
            </tr>
          `)
          .join("");
      } catch (err) {
        document.getElementById("workOrdersTableBody").innerHTML =
          `<tr><td colspan="4">Erreur: ${err.message}</td></tr>`;
      }
    }

    // Assigne un bon
    async function assignWorkOrder() {
      const title = document.getElementById("orderTitle").value;
      const description = document.getElementById("orderDesc").value;
      const team_leader_id = document.getElementById("chefSelect").value;
      const assigned_date = document.getElementById("orderDate").value;
      const alertDiv = document.getElementById("assignOrderAlert");
      const btn = document.getElementById("assignBtn");

      if (!title || !team_leader_id || !assigned_date) {
        alertDiv.classList.add("error");
        alertDiv.innerHTML = "Tous les champs requis doivent être remplis";
        return;
      }

      btn.disabled = true;
      alertDiv.classList.remove("error", "success");

      try {
        const { data: session } = await supabaseClient.auth.getSession();
        const token = session?.session?.access_token;

        const response = await fetch(`${API_URL}/api/admin/assign-workorder`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`,
          },
          body: JSON.stringify({
            title,
            description,
            team_leader_id,
            assigned_date,
          }),
        });

        const result = await response.json();

        if (!response.ok) throw new Error(result.error);

        alertDiv.classList.add("success");
        alertDiv.innerHTML = "✅ Bon assigné avec succès!";

        document.getElementById("orderTitle").value = "";
        document.getElementById("orderDesc").value = "";
        document.getElementById("orderDate").value = "";

        loadWorkOrders();

        setTimeout(() => alertDiv.innerHTML = "", 3000);
      } catch (err) {
        alertDiv.classList.add("error");
        alertDiv.innerHTML = `❌ ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    function statusLabel(status) {
      const labels = {
        pending: "⏳ En attente",
        in_progress: "🔄 En cours",
        completed: "✅ Complété",
      };
      return labels[status] || status;
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location = "/login.html";
    }

    init();
  </script>
</body>
</html>
