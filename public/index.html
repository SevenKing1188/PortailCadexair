<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portail Cadexair - Connexion</title>
  <style>
    :root {
      --bg-color: #000000; /* Fond noir uni */
      --card-bg: #111827;
      --accent-color: #dc2626; /* Rouge Cadexair */
      --accent-hover: #b91c1c;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1f2937;
      --error-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
    }

    /* Image du logo pleine largeur */
    .logo-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
      margin-bottom: 24px;
      object-fit: contain;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background-color: #000000;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus {
      border-color: var(--accent-color);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .error-message {
      color: var(--error-color);
      font-size: 0.875rem;
      margin-top: 16px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <!-- Image du logo Cadexair positionnée en haut et sur toute la largeur -->
    <img src="/logo.jpg" alt="Cadexair Expertise & Innovation" class="logo-img" />

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Adresse courriel</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="nom@cadexair.com" 
          autocomplete="username" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="••••••••••••" 
          autocomplete="current-password" 
          required 
        />
      </div>

      <button type="submit" class="btn-submit">Se connecter</button>
      <div id="errorMessage" class="error-message"></div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');

      errorDiv.style.display = 'none';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          window.location.href = '/dashboard.html';
        } else {
          errorDiv.innerText = data.error || 'Erreur de connexion.';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.innerText = 'Erreur réseau. Veuillez réessayer.';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
