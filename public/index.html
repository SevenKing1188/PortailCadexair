<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Cadexair</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- CONTENEUR GLOBAL -->
    <div id="app" class="flex flex-col min-h-screen">

        <!-- 1. ÉCRAN DE CONNEXION -->
        <div id="login-screen" class="flex items-center justify-center flex-grow p-4">
            <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
                <div class="text-center mb-6">
                    <h1 class="text-2xl font-bold text-blue-900">Cadexair</h1>
                    <p class="text-gray-500 text-sm">Portail Opérationnel</p>
                </div>
                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nom d'utilisateur</label>
                        <input type="text" id="username" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Mot de passe</label>
                        <input type="password" id="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <button type="submit" class="w-full bg-blue-900 text-white py-2 px-4 rounded-lg hover:bg-blue-800 transition font-medium">Se connecter</button>
                    <p id="login-error" class="text-red-500 text-sm text-center mt-2 hidden"></p>
                </form>
            </div>
        </div>

        <!-- 2. APPLICATION INTERNE (Cachée par défaut) -->
        <div id="dashboard-screen" class="hidden flex flex-col flex-grow">
            <!-- Navigation -->
            <header class="bg-blue-900 text-white shadow">
                <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                    <div class="flex items-center space-x-4">
                        <h1 class="text-xl font-bold">Portail Cadexair</h1>
                        <span id="user-badge" class="bg-blue-800 text-xs px-2.5 py-1 rounded-full uppercase tracking-wide"></span>
                    </div>
                    <nav class="flex space-x-2">
                        <button onclick="switchTab('orders')" id="tab-orders" class="px-3 py-2 rounded-lg bg-blue-800 text-sm font-medium transition">Bons de travail</button>
                        <button onclick="switchTab('schedule')" id="tab-schedule" class="px-3 py-2 rounded-lg hover:bg-blue-800 text-sm font-medium transition">Horaire</button>
                        <button onclick="switchTab('settings')" id="tab-settings" class="px-3 py-2 rounded-lg hover:bg-blue-800 text-sm font-medium transition">Paramètres</button>
                        <button onclick="logout()" class="px-3 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-sm font-medium transition ml-4">Déconnexion</button>
                    </nav>
                </div>
            </header>

            <!-- Contenu principal -->
            <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

                <!-- SECTION : BONS DE TRAVAIL -->
                <section id="section-orders" class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-bold text-gray-800">Bons de travail en cours</h2>
                    </div>
                    <div id="orders-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Rempli dynamiquement -->
                    </div>
                </section>

                <!-- SECTION : HORAIRE PDF -->
                <section id="section-schedule" class="hidden space-y-6">
                    <div class="bg-white p-6 rounded-xl shadow">
                        <h2 class="text-xl font-bold text-gray-800 mb-4">Horaire de l'équipe</h2>
                        
                        <!-- Zone Upload (Admin / Master uniquement) -->
                        <div id="admin-schedule-upload" class="mb-6 p-4 bg-gray-50 border border-dashed border-gray-300 rounded-lg hidden">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Mettre à jour l'horaire (PDF)</label>
                            <input type="file" id="schedule-file" accept="application/pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                            <button onclick="uploadSchedule()" class="mt-3 bg-blue-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-800">Téléverser l'horaire</button>
                        </div>

                        <!-- Visionneuse PDF -->
                        <div class="border rounded-lg overflow-hidden h-[600px] bg-gray-200 flex flex-col items-center justify-center" id="schedule-viewer-container">
                            <p class="text-gray-500 mb-2">Aucun horaire PDF disponible pour le moment.</p>
                        </div>
                    </div>
                </section>

                <!-- SECTION : PARAMÈTRES & GESTION DES UTILISATEURS -->
                <section id="section-settings" class="hidden space-y-6">
                    <div class="bg-white p-6 rounded-xl shadow max-w-2xl mx-auto space-y-8">
                        <div>
                            <h2 class="text-xl font-bold text-gray-800 mb-4">Paramètres et Gestion des Utilisateurs</h2>
                            
                            <!-- Formulaire de création de compte -->
                            <div id="user-creation-card" class="border-t pt-4">
                                <h3 class="text-lg font-semibold text-gray-700 mb-3">Créer un nouvel utilisateur</h3>
                                <form id="create-user-form" onsubmit="handleCreateUser(event)" class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700">Nom d'utilisateur</label>
                                        <input type="text" id="new-username" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700">Département</label>
                                        <input type="text" id="new-department" placeholder="Ex: Ventilation" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700">Mot de passe temporaire</label>
                                        <input type="password" id="new-password" placeholder="password123" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700">Type de compte (Rôle)</label>
                                        <select id="new-role" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                            <option value="employe">Chef d'équipe / Technicien</option>
                                            <option value="admin" id="option-admin-role">Administrateur Secondaire</option>
                                        </select>
                                    </div>
                                    <button type="submit" class="w-full bg-blue-900 text-white py-2 px-4 rounded-lg hover:bg-blue-800 transition font-medium">Créer le compte</button>
                                    <p id="create-user-msg" class="text-sm text-center mt-2 hidden"></p>
                                </form>
                            </div>
                        </div>

                        <!-- Liste des utilisateurs existants (Pour suppression par le master/admin) -->
                        <div class="border-t pt-6">
                            <h3 class="text-lg font-semibold text-gray-700 mb-3">Liste des utilisateurs enregistrés</h3>
                            <div id="users-list-container" class="space-y-2 max-h-60 overflow-y-auto">
                                <!-- Rempli dynamiquement -->
                            </div>
                        </div>
                    </div>
                </section>

            </main>
        </div>

    </div>

    <!-- LOGIQUE JAVASCRIPT FRONT-END -->
    <script>
        const API_URL = '';
        let currentUser = null;

        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const savedUser = localStorage.getItem('user');
            if (token && savedUser) {
                currentUser = JSON.parse(savedUser);
                showDashboard();
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');

            try {
                const res = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Erreur de connexion');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                currentUser = data.user;
                showDashboard();
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.classList.remove('hidden');
            }
        }

        function showDashboard() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            document.getElementById('user-badge').textContent = `${currentUser.username} (${currentUser.role})`;

            // Gestion option admin secondaire : Seul le master peut en créer
            const adminRoleOption = document.getElementById('option-admin-role');
            if (currentUser.role !== 'master') {
                if (adminRoleOption) adminRoleOption.style.display = 'none';
            }

            // Gestion affichage upload horaire
            if (currentUser.role === 'master' || currentUser.role === 'admin') {
                document.getElementById('admin-schedule-upload').classList.remove('hidden');
            }

            loadWorkOrders();
            loadSchedule();
            loadUsersList();
        }

        function logout() {
            localStorage.clear();
            window.location.reload();
        }

        function switchTab(tab) {
            ['orders', 'schedule', 'settings'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('bg-blue-800');
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('bg-blue-800');
        }

        async function loadWorkOrders() {
            try {
                const res = await fetch(`${API_URL}/api/work-orders`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                const orders = await res.json();
                const listEl = document.getElementById('orders-list');
                listEl.innerHTML = '';

                if (orders.length === 0) {
                    listEl.innerHTML = '<p class="text-gray-500 col-span-2">Aucun bon de travail en attente.</p>';
                    return;
                }

                orders.forEach(o => {
                    listEl.innerHTML += `
                        <div class="bg-white p-5 rounded-xl shadow space-y-2 border">
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-lg text-blue-900">${o.client_name}</h3>
                                <span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded">${o.status}</span>
                            </div>
                            <p class="text-sm text-gray-600"><strong>Adresse :</strong> ${o.client_address}</p>
                            <p class="text-sm text-gray-600"><strong>Chef d'équipe :</strong> ${o.team_lead_name}</p>
                            <p class="text-sm text-gray-600"><strong>Date :</strong> ${o.appointment_date} à ${o.appointment_time}</p>
                        </div>
                    `;
                });
            } catch (err) {
                console.error('Erreur chargement bons de travail', err);
            }
        }

        async function handleCreateUser(e) {
            e.preventDefault();
            const username = document.getElementById('new-username').value;
            const department = document.getElementById('new-department').value;
            const password = document.getElementById('new-password').value;
            const role = document.getElementById('new-role').value;
            const msgEl = document.getElementById('create-user-msg');

            try {
                const res = await fetch(`${API_URL}/api/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ username, department, password, role })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Erreur lors de la création');

                msgEl.textContent = 'Utilisateur créé avec succès !';
                msgEl.classList.remove('hidden', 'text-red-500');
                msgEl.classList.add('text-green-600');
                document.getElementById('create-user-form').reset();
                loadUsersList();
            } catch (err) {
                msgEl.textContent = err.message;
                msgEl.classList.remove('hidden', 'text-green-600');
                msgEl.classList.add('text-red-500');
            }
        }

        async function loadUsersList() {
            try {
                const res = await fetch(`${API_URL}/api/users`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                const users = await res.json();
                const container = document.getElementById('users-list-container');
                container.innerHTML = '';

                users.forEach(u => {
                    container.innerHTML += `
                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg border text-sm">
                            <div>
                                <span class="font-bold">${u.username}</span> 
                                <span class="text-gray-500 text-xs">(${u.department || 'Général'} - ${u.role})</span>
                            </div>
                            ${(currentUser.role === 'master' || (currentUser.role === 'admin' && u.role === 'employe')) ? 
                                `<button onclick="deleteUser(${u.id})" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 text-xs font-medium">Supprimer</button>` 
                                : ''}
                        </div>
                    `;
                });
            } catch (err) {
                console.error('Erreur chargement utilisateurs', err);
            }
        }

        async function deleteUser(id) {
            if (!confirm('Voulez-vous vraiment supprimer cet utilisateur ?')) return;
            try {
                const res = await fetch(`${API_URL}/api/users/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Erreur lors de la suppression');
                loadUsersList();
            } catch (err) {
                alert(err.message);
            }
        }

        function uploadSchedule() {
            const fileInput = document.getElementById('schedule-file');
            if (fileInput.files.length === 0) return alert('Veuillez sélectionner un fichier PDF.');
            
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                localStorage.setItem('cadexair_schedule', e.target.result);
                loadSchedule();
                alert('Horaire mis à jour avec succès !');
            };
            reader.readAsDataURL(file);
        }

        function loadSchedule() {
            const container = document.getElementById('schedule-viewer-container');
            const savedPdf = localStorage.getItem('cadexair_schedule');

            if (savedPdf) {
                container.innerHTML = `
                    <iframe src="${savedPdf}" class="w-full h-full" frameborder="0"></iframe>
                    <div class="p-3 bg-white w-full border-t flex justify-end">
                        <a href="${savedPdf}" download="Horaire_Cadexair.pdf" class="bg-blue-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-800">Télécharger l'horaire PDF</a>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
