<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Cadexair - Portal v3.1</title>
  <style>
    :root {
      --bg-black: #0d0d0d;
      --card-bg: #171717;
      --accent-red: #e50914;
      --accent-red-hover: #b80710;
      --text-white: #ffffff;
      --text-gray: #a3a3a3;
      --border-color: #262626;
    }

    body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg-black); color: var(--text-white); }
    header { background: var(--card-bg); padding: 1rem 2rem; border-bottom: 2px solid var(--accent-red); display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; color: var(--accent-red); font-size: 1.5rem; text-transform: uppercase; }

    .btn-settings { background: none; border: none; color: var(--text-white); font-size: 1.5rem; cursor: pointer; }

    /* Panneau Latéral */
    .sidebar { position: fixed; top: 0; right: -400px; width: 350px; height: 100%; background: var(--card-bg); border-left: 2px solid var(--accent-red); transition: 0.3s; padding: 1.5rem; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; z-index: 100; }
    .sidebar.open { right: 0; }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
    .sidebar-footer { font-size: 0.8rem; color: var(--text-gray); text-align: center; border-top: 1px solid var(--border-color); padding-top: 1rem; }

    .container { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; padding: 2rem; max-width: 1400px; margin: 0 auto; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.5rem; }
    
    .form-row { display: flex; gap: 1rem; }
    .form-group { margin-bottom: 1rem; flex: 1; }
    label { display: block; margin-bottom: 0.3rem; color: var(--text-gray); font-size: 0.85rem; }
    input, select, textarea { width: 100%; padding: 0.6rem; background: var(--bg-black); border: 1px solid var(--border-color); color: var(--text-white); border-radius: 4px; box-sizing: border-box; }

    button { width: 100%; padding: 0.75rem; background: var(--accent-red); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background: var(--accent-red-hover); }

    /* Historique */
    .history-item { background: var(--bg-black); border: 1px solid var(--border-color); padding: 1rem; margin-bottom: 0.5rem; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; }
    .history-item:hover { border-color: var(--accent-red); }

    /* Modal Détails */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 200; }
    .modal-content { background: var(--card-bg); padding: 2rem; border-radius: 8px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; border: 1px solid var(--accent-red); }
  </style>
</head>
<body>

  <header>
    <h1>Cadexair - Administration</h1>
    <button class="btn-settings" id="openSettings">⚙️</button>
  </header>

  <!-- Panneau Latéral Paramètres -->
  <div class="sidebar" id="sidebar">
    <div>
      <div class="sidebar-header">
        <h2>Paramètres</h2>
        <button id="closeSettings" style="width:auto;">✕</button>
      </div>

      <div style="margin-top: 1.5rem;">
        <h3>Création d'Utilisateur</h3>
        <form id="createUserForm">
          <div class="form-group"><label>Nom d'utilisateur</label><input type="text" id="username" required></div>
          <div class="form-group"><label>Courriel</label><input type="email" id="email" required></div>
          <div class="form-group"><label>Mot de passe</label><input type="password" id="password" required></div>
          <div class="form-group">
            <label>Type de compte</label>
            <select id="role"><option value="chef_equipe">Chef d'équipe</option><option value="admin">Admin secondaire</option></select>
          </div>
          <div class="form-group">
            <label>Département</label>
            <select id="department"><option value="Ventilation">Ventilation</option><option value="Propreté">Propreté</option><option value="Maintenance">Maintenance</option></select>
          </div>
          <button type="submit">Créer l'utilisateur</button>
        </form>
      </div>

      <div style="margin-top: 2rem;">
        <button id="logoutBtn">Déconnexion</button>
      </div>
    </div>

    <div class="sidebar-footer">
      fait par Guillaume.L pour Cadexair 2026. version 3.1
    </div>
  </div>

  <!-- Contenu Principal -->
  <div class="container">
    <!-- Formulaire Bon de Travail -->
    <div class="card">
      <h2>Créer un Bon de Travail</h2>
      <form id="workOrderForm">
        <div class="form-group"><label>Titre de la tâche</label><input type="text" id="woTitle" required></div>
        
        <!-- Infos Client -->
        <h3>Informations Client</h3>
        <div class="form-group"><label>Nom du Client</label><input type="text" id="clientName" required></div>
        <div class="form-group"><label>Adresse Complète</label><input type="text" id="clientAddress" required></div>
        <div class="form-row">
          <div class="form-group"><label>Date de Rendez-vous</label><input type="date" id="appointmentDate" required></div>
          <div class="form-group"><label>Heure</label><input type="time" id="appointmentTime" required></div>
        </div>

        <!-- Quantités -->
        <div class="form-row">
          <div class="form-group"><label>Nb Hottes</label><input type="number" id="nbHottes" value="0"></div>
          <div class="form-group"><label>Nb Portes d'accès</label><input type="number" id="nbPortesAcces" value="0"></div>
          <div class="form-group"><label>Nb Ventilateurs</label><input type="number" id="nbVentilateurs" value="0"></div>
        </div>

        <div class="form-group">
          <label>Département</label>
          <select id="woDepartment"><option value="Ventilation">Ventilation</option><option value="Propreté">Propreté</option><option value="Maintenance">Maintenance</option></select>
        </div>
        <div class="form-group"><label>Assigner à un Chef d'équipe</label><select id="woAssignee"></select></div>
        <div class="form-group"><label>Description des travaux</label><textarea id="woDescription" rows="3" required></textarea></div>
        <button type="submit">Attribuer le Bon de Travail</button>
      </form>
    </div>

    <!-- Historique des Bons de Travail -->
    <div class="card">
      <h2>Historique des Bons de Travail</h2>
      <div id="historyList">Chargement...</div>
    </div>
  </div>

  <!-- Modal Détails -->
  <div class="modal" id="detailsModal">
    <div class="modal-content">
      <h2 id="modalTitle">Détails du Bon de Travail</h2>
      <div id="modalBody"></div>
      <button onclick="document.getElementById('detailsModal').style.display='none'" style="margin-top:1rem;">Fermer</button>
    </div>
  </div>

  <script>
    // Panneau Paramètres
    document.getElementById('openSettings').onclick = () => document.getElementById('sidebar').classList.add('open');
    document.getElementById('closeSettings').onclick = () => document.getElementById('sidebar').classList.remove('open');

    // Déconnexion avec redirection
    document.getElementById('logoutBtn').onclick = async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    };

    // Chargement de l'historique
    async function loadHistory() {
      const res = await fetch('/api/work-orders');
      const orders = await res.json();
      const list = document.getElementById('historyList');
      list.innerHTML = orders.map(o => `
        <div class="history-item" onclick="openDetails(${o.id})">
          <div><strong>${o.title}</strong> - ${o.client_name || 'Client N/A'}</div>
          <div><span style="color:${o.status==='Terminé'?'green':'orange'}">${o.status}</span></div>
        </div>
      `).join('');
    }

    loadHistory();
  </script>
</body>
</html>
