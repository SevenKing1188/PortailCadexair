<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadexair - Administration</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #111827;
      --accent-color: #dc2626;
      --accent-hover: #b91c1c;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    .header-actions button {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 8px;
    }

    .main-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 900px) {
      .main-container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
    }

    .card h2 {
      margin-bottom: 20px;
      font-size: 1.2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      background-color: #000000;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      font-size: 0.95rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .history-item {
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }

    .sidebar {
      position: fixed;
      right: -350px;
      top: 0;
      width: 350px;
      height: 100%;
      background-color: var(--card-bg);
      border-left: 1px solid var(--border-color);
      transition: right 0.3s ease;
      padding: 24px;
      z-index: 100;
    }

    .sidebar.open {
      right: 0;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal-content {
      background-color: var(--card-bg);
      padding: 24px;
      border-radius: 8px;
      max-width: 500px;
      width: 100%;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">CADEXAIR - ADMINISTRATION</div>
    <div class="header-actions">
      <button id="openSettings">Paramètres</button>
      <button id="logoutBtn">Déconnexion</button>
    </div>
  </header>

  <div class="main-container">
    <!-- Formulaire Bon de Travail -->
    <div class="card">
      <h2>Créer un Bon de Travail</h2>
      <form id="workOrderForm">
        <div class="form-group">
          <label for="woTitle">Titre de la tâche</label>
          <input type="text" id="woTitle" name="woTitle" autocomplete="off" required />
        </div>

        <div class="form-group">
          <label for="clientName">Nom du Client</label>
          <input type="text" id="clientName" name="clientName" autocomplete="organization" required />
        </div>

        <div class="form-group">
          <label for="clientAddress">Adresse Complète</label>
          <input type="text" id="clientAddress" name="clientAddress" autocomplete="street-address" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="appointmentDate">Date</label>
            <input type="date" id="appointmentDate" name="appointmentDate" autocomplete="off" required />
          </div>
          <div class="form-group">
            <label for="appointmentTime">Heure</label>
            <input type="time" id="appointmentTime" name="appointmentTime" autocomplete="off" required />
          </div>
          <div class="form-group">
            <label for="woDepartment">Département</label>
            <select id="woDepartment" name="woDepartment" autocomplete="off">
              <option value="Nettoyage">Nettoyage</option>
              <option value="Installation">Installation</option>
              <option value="Service">Service</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="nbHottes">Nb Hottes</label>
            <input type="number" id="nbHottes" name="nbHottes" value="0" min="0" autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="nbPortesAcces">Nb Portes d'accès</label>
            <input type="number" id="nbPortesAcces" name="nbPortesAcces" value="0" min="0" autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="nbVentilateurs">Nb Ventilateurs</label>
            <input type="number" id="nbVentilateurs" name="nbVentilateurs" value="0" min="0" autocomplete="off" />
          </div>
        </div>

        <div class="form-group">
          <label for="woAssignee">Assigner à (Chef d'équipe)</label>
          <select id="woAssignee" name="woAssignee" autocomplete="off" required></select>
        </div>

        <div class="form-group">
          <label for="woDescription">Description / Instructions</label>
          <textarea id="woDescription" name="woDescription" rows="4" autocomplete="off" required></textarea>
        </div>

        <button type="submit" class="btn-primary">Créer et Attribuer</button>
      </form>
    </div>

    <!-- Historique des Bons de Travail -->
    <div class="card">
      <h2>Historique des Bons de Travail</h2>
      <div id="historyList">Chargement...</div>
    </div>
  </div>

  <!-- Panneau Paramètres / Création d'Utilisateur -->
  <div class="sidebar" id="sidebar">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h3>Créer un Utilisateur</h3>
      <button id="closeSettings" style="background: none; border: none; color: white; cursor: pointer;">✕</button>
    </div>
    <form id="createUserForm">
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" name="username" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="email">Adresse courriel</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required />
      </div>
      <div class="form-group">
        <label for="role">Rôle</label>
        <select id="role" name="role" autocomplete="off">
          <option value="chef_equipe">Chef d'équipe</option>
          <option value="admin">Administrateur</option>
        </select>
      </div>
      <div class="form-group">
        <label for="department">Département</label>
        <select id="department" name="department" autocomplete="off">
          <option value="Nettoyage">Nettoyage</option>
          <option value="Installation">Installation</option>
          <option value="Service">Service</option>
        </select>
      </div>
      <button type="submit" class="btn-primary">Créer le compte</button>
    </form>
  </div>

  <!-- Modale Détails -->
  <div class="modal" id="detailsModal">
    <div class="modal-content">
      <h3 id="modalTitle" style="margin-bottom: 12px; color: var(--accent-color);"></h3>
      <div id="modalBody" style="margin-bottom: 20px; font-size: 0.95rem; line-height: 1.5;"></div>
      <button id="closeModalBtn" class="btn-primary">Fermer</button>
    </div>
  </div>

  <script src="/dashboard.js"></script>
</body>
</html>
