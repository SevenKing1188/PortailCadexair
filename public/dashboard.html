<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord - Cadexair</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; }
    header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; }
    .card { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .form-group { margin-bottom: 10px; display: flex; flex-direction: column; }
    input, select, textarea { padding: 8px; margin-top: 4px; }
    button { padding: 8px 16px; cursor: pointer; }

    .time-entry-box { background: #eef2f5; padding: 15px; border-radius: 6px; margin-top: 15px; border-left: 4px solid #007bff; }
    .time-row { display: flex; align-items: center; gap: 15px; margin-bottom: 8px; }
    .time-row label { flex: 1; font-weight: bold; }

    /* Sidebar */
    .side-panel { position: fixed; top: 0; right: -400px; width: 360px; height: 100%; background: #fff; box-shadow: -2px 0 5px rgba(0,0,0,0.2); transition: right 0.3s ease; padding: 20px; z-index: 1000; overflow-y: auto; }
    .side-panel.open { right: 0; }
    .tech-select-row { display: flex; gap: 10px; margin-bottom: 5px; }
    .danger-btn { background-color: #dc3545; color: white; border: none; border-radius: 4px; padding: 8px 12px; }
  </style>
</head>
<body>

  <header>
    <h1>Gestion des Bons</h1>
    <div>
      <button id="settings-btn">⚙️ Paramètres</button>
      <button id="logout-btn">Déconnexion</button>
    </div>
  </header>

  <!-- FORMULAIRE BON DE TRAVAIL -->
  <section class="card">
    <h2>Nouveau Bon de Travail</h2>
    <form id="work-order-form">
      <h3>Informations Client</h3>
      <div class="form-grid">
        <div class="form-group"><label>Nom Client</label><input type="text" name="clientName" required></div>
        <div class="form-group"><label>Adresse</label><input type="text" name="clientAddress" required></div>
        <div class="form-group"><label>Nom du Contact</label><input type="text" name="contactName" placeholder="Ex: Marc Tremblay"></div>
        <div class="form-group"><label>Téléphone du Contact</label><input type="tel" name="contactPhone" placeholder="Ex: 514-555-0199"></div>
        <div class="form-group"><label>Département</label><input type="text" name="department"></div>
        <div class="form-group"><label>Date</label><input type="date" name="appointmentDate" required></div>
        <div class="form-group"><label>Heure</label><input type="time" name="appointmentTime" required></div>
        <div class="form-group">
          <label>Chef d'équipe assigné</label>
          <select name="assignedTo" id="assignedTo" required><option value="">Chargement...</option></select>
        </div>
      </div>

      <h3 style="margin-top:20px;">Sélection des Techniciens</h3>
      <div id="technicians-select-container"></div>
      <button type="button" id="add-tech-btn">+ Affecter un autre employé</button>

      <!-- BOUTON & SECTION ENTRÉE DE TEMPS -->
      <div style="margin-top: 20px;">
        <button type="button" id="generate-time-entries-btn" style="background:#28a745; color:#fff; border:none; padding:10px 15px; border-radius:4px;">⏱️ Saisir les heures de travail</button>
      </div>

      <div id="time-entries-panel" class="time-entry-box" style="display:none;">
        <h4>Entrée de temps individuelle (Chef + Employés)</h4>
        <div id="time-entries-list"></div>
      </div>

      <div class="form-group" style="margin-top:20px;">
        <label>Description du travail</label>
        <textarea name="description" rows="3"></textarea>
      </div>
      <button type="submit" style="margin-top:10px;">Créer le bon de travail</button>
    </form>
  </section>

  <!-- LISTE DES BONS -->
  <section class="card">
    <h2>Bons récents</h2>
    <div id="work-orders-list"></div>
  </section>

  <!-- PANNEAU PARAMÈTRES (Sidebar) -->
  <aside id="side-panel" class="side-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3>Paramètres Admin</h3>
      <button id="close-panel-btn">X</button>
    </div>
    <hr>
    
    <!-- Section 1 : Nouveau Chef d'équipe -->
    <h4>1. Nouveau Chef d'équipe</h4>
    <form id="create-user-form">
      <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
      <div class="form-group"><label>Mot de passe</label><input type="password" name="password" required></div>
      <div class="form-group"><label>Nom / Username</label><input type="text" name="username" required></div>
      <div class="form-group">
        <label>Rôle</label>
        <select name="role">
          <option value="chef">Chef d'équipe</option>
          <option value="admin">Administrateur</option>
        </select>
      </div>
      <button type="submit">Créer chef d'équipe</button>
    </form>

    <hr style="margin:20px 0;">

    <!-- Section 2 : Ajouter un Employé Terrain -->
    <h4>2. Ajouter un Employé (Terrain)</h4>
    <form id="create-employee-form">
      <div class="form-group">
        <label>Nom complet de l'employé</label>
        <input type="text" name="fullName" placeholder="Ex: Luc Bouchard" required>
      </div>
      <button type="submit">Ajouter l'employé</button>
    </form>

    <hr style="margin:20px 0;">

    <!-- Section 3 : Gestion & Suppression des Employés -->
    <h4>3. Gestion & Suppression des Employés</h4>
    <div class="form-group">
      <label>Liste des employés terrain</label>
      <select id="manage-employees-select">
        <option value="">Chargement...</option>
      </select>
    </div>
    <button type="button" id="delete-employee-btn" class="danger-btn">Supprimer cet employé</button>
  </aside>

  <script src="dashboard.js"></script>
</body>
</html>
