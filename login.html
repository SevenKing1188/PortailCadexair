<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Portail Cadexair</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0F2537 0%, #1a3a52 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      max-width: 400px;
      width: 100%;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 {
      font-size: 28px;
      color: #0F2537;
      margin-bottom: 8px;
    }

    .login-header p {
      color: #999;
      font-size: 14px;
    }

    .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #EE1C25 0%, #E65100 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #0F2537;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #EE1C25;
      box-shadow: 0 0 0 3px rgba(238,28,37,0.1);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #EE1C25 0%, #d41b20 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 20px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(238,28,37,0.3);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .error-message {
      background: #ffe5e5;
      color: #EE1C25;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .success-message {
      background: #e5ffe5;
      color: #51cf66;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .loading {
      display: none;
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-top: 10px;
    }

    .test-users {
      background: #f9f9f9;
      padding: 16px;
      border-radius: 6px;
      margin-top: 24px;
      border: 1px solid #e0e0e0;
    }

    .test-users h3 {
      font-size: 12px;
      font-weight: 600;
      color: #0F2537;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .test-user {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .test-user code {
      background: white;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
      color: #EE1C25;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="logo">📋</div>
      <h1>CADEXAIR</h1>
      <p>Portail Opérationnel v3.0</p>
    </div>

    <form onsubmit="login(event)">
      <div class="error-message" id="error-msg"></div>
      <div class="success-message" id="success-msg"></div>

      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          placeholder="master@cadexair.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input 
          type="password" 
          id="password" 
          placeholder="••••••••"
          required
        >
      </div>

      <button type="submit" class="login-btn" id="login-btn">
        🔓 Se connecter
      </button>

      <div class="loading" id="loading">
        Connexion en cours...
      </div>
    </form>

    <div class="test-users">
      <h3>📌 Comptes de test</h3>
      <div class="test-user">
        <strong>Master:</strong><br>
        <code>master@cadexair.com</code><br>
        <code>Test123!</code>
      </div>
      <div class="test-user">
        <strong>Chef d'équipe:</strong><br>
        <code>chef@cadexair.com</code><br>
        <code>Test123!</code>
      </div>
      <div class="test-user">
        <strong>Technicien:</strong><br>
        <code>tech@cadexair.com</code><br>
        <code>Test123!</code>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://portail-cadexair.onrender.com/api';

    async function login(event) {
      event.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      const successMsg = document.getElementById('success-msg');
      const loginBtn = document.getElementById('login-btn');
      const loading = document.getElementById('loading');

      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      loading.style.display = 'block';
      loginBtn.disabled = true;

      try {
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Erreur de connexion');
        }

        localStorage.setItem('cadexair_token', data.token);
        localStorage.setItem('cadexair_user', JSON.stringify(data.user));

        successMsg.textContent = '✅ Connexion réussie! Redirection...';
        successMsg.style.display = 'block';

        setTimeout(() => {
          window.location.href = '/portail-cadexair-frontend.html';
        }, 1500);

      } catch (error) {
        errorMsg.textContent = '❌ ' + error.message;
        errorMsg.style.display = 'block';
      } finally {
        loading.style.display = 'none';
        loginBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
